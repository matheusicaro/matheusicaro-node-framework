name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage report on PR
        uses: ArtiomTr/jest-coverage-report-action@v2.3.1
        with:
          test-script: npm test -- --coverage
          skip-step: install

      - name: Build
        run: npm run build

      - name: Audit dependencies (non-blocking)
        if: always()
        run: npm audit --audit-level=moderate
        continue-on-error: true
